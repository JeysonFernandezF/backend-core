<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName safe.indemin.cl
    ServerAlias www.safe.indemin.cl
    

    ProxyPass / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/

    ProxyPreserveHost On
    
    ProxyTimeout 300
    

    ProxyAddHeaders On
    
    # Habilitar CORS para API REST
    # Opción 1:
    Header always set Access-Control-Allow-Origin "*"
    Header always set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS"
    Header always set Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With, Accept, Origin"
    Header always set Access-Control-Allow-Credentials "true"
    
    # Opción 2: 
    # Descomentar y ajustar según tus necesidades
    # Header always set Access-Control-Allow-Origin "https://dominioFrontend.com"
    # Header always set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS"
    # Header always set Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With, Accept, Origin"
    # Header always set Access-Control-Allow-Credentials "true"
    
    RewriteEngine On
    RewriteCond %{REQUEST_METHOD} OPTIONS
    RewriteRule ^(.*)$ $1 [R=200,L]
    
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    
    Header always unset X-Powered-By
    Header unset X-Powered-By

    ErrorLog ${APACHE_LOG_DIR}/safe_emin_cl_error.log
    CustomLog ${APACHE_LOG_DIR}/safe_emin_cl_access.log combined
    
    # SSL Configuration
    SSLCertificateFile /etc/letsencrypt/live/dev.indemin.cl/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/dev.indemin.cl/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
    
    # SSL Protocol Configuration (recomendado para producción)
    # SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    # SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    # SSLHonorCipherOrder off
    
</VirtualHost>
</IfModule>

# Redirect HTTP to HTTPS
<VirtualHost *:80>
    ServerName safe.emin.cl
    ServerAlias www.safe.emin.cl
    
    # Redirigir todo el tráfico HTTP a HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
    
    # Logs
    ErrorLog ${APACHE_LOG_DIR}/safe_emin_cl_http_error.log
    CustomLog ${APACHE_LOG_DIR}/safe_emin_cl_http_access.log combined
</VirtualHost>